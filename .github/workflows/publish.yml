name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  deployments: write

jobs:
  publish:
    name: Build, attest, deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            bot/package-lock.json
      - name: Require the public app id
        env:
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, sys
          app_id = os.environ.get("PRIVY_APP_ID", "")
          if len(app_id) != 25:
              sys.stderr.write("Set the repository variable PRIVY_APP_ID to the public 25-character Privy app id.\n")
              sys.exit(1)
          PY
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi
      - name: Install and test the CLI
        working-directory: bot
        run: |
          npm ci
          npm test
      - name: Install and build the approval page
        working-directory: app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SOURCE_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          NEXT_PUBLIC_PRIVY_CLIENT_ID: ${{ vars.PRIVY_CLIENT_ID }}
        run: |
          npm ci
          npm run lint
          npm run build
          node ../scripts/check-headers.mjs out
      - name: Pack reproducible archives
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p dist
          node scripts/hash-tree.mjs app/out > dist/approval-page.MANIFEST
          if grep -R "BEGIN PRIVATE KEY" app/out; then
            echo "build output contains a private key" >&2
            exit 1
          fi
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -C app -czf dist/grokwallet-app.tar.gz out
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            --exclude=node_modules --exclude=.next \
            -czf dist/grokwallet-bot.tar.gz bot
          (cd dist && sha256sum grokwallet-app.tar.gz grokwallet-bot.tar.gz approval-page.MANIFEST > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/grokwallet-app.tar.gz
            dist/grokwallet-bot.tar.gz
            dist/approval-page.MANIFEST
            dist/SHA256SUMS
      - name: Unpack the attested approval page
        run: |
          set -eu
          rm -rf dist/unpack dist/site
          mkdir -p dist/unpack
          tar -xzf dist/grokwallet-app.tar.gz -C dist/unpack
          mv dist/unpack/out dist/site
          node scripts/hash-tree.mjs dist/site > /tmp/deployed.MANIFEST
          diff -u dist/approval-page.MANIFEST /tmp/deployed.MANIFEST
      - name: Deploy the attested files to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          packageManager: npm
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT != '' && vars.CLOUDFLARE_PAGES_PROJECT || 'grokwallet' }} --branch=main --commit-dirty=true --commit-hash=${{ github.sha }}
      - name: Decide whether to pin to IPFS
        id: ipfs
        env:
          IPFS_PINNING_TOKEN: ${{ secrets.IPFS_PINNING_TOKEN }}
        run: |
          set -eu
          if [ -n "${IPFS_PINNING_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "IPFS_CID=skipped" >> "$GITHUB_ENV"
          fi
      - name: Pin the attested files to IPFS
        if: steps.ipfs.outputs.enabled == 'true'
        env:
          IPFS_PINNING_TOKEN: ${{ secrets.IPFS_PINNING_TOKEN }}
        run: |
          set -eu
          CID=$(sh scripts/pin-ipfs.sh dist/site)
          echo "IPFS_CID=${CID}" >> "$GITHUB_ENV"
      - name: Write the job summary
        env:
          PAGES_URL: ${{ steps.pages.outputs.deployment-url }}
          PAGES_ALIAS: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' && vars.CLOUDFLARE_PAGES_PROJECT || 'grokwallet' }}
          APP_ID: ${{ vars.PRIVY_APP_ID }}
        run: |
          set -eu
          CID="${IPFS_CID:-skipped}"
          {
            echo "### GrokWallet approval page"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Public Privy app id: \`${APP_ID}\`"
            echo "- Cloudflare Pages project: \`${PROJECT}\` (branch \`main\`)"
            echo "- Deployment: ${PAGES_URL}"
            echo "- Alias: ${PAGES_ALIAS}"
            if [ "$CID" = "skipped" ]; then
              echo "- IPFS: skipped. \`IPFS_PINNING_TOKEN\` is not set."
            else
              echo "- IPFS CID: \`${CID}\`"
              echo "- Gateway: https://gateway.pinata.cloud/ipfs/${CID}/"
            fi
            echo ""
            echo "Set the Privy verification URI to \`https://grokwallet.fun/\`."
          } | tee -a "$GITHUB_STEP_SUMMARY" > dist/RELEASE_NOTES.md
          {
            echo ""
            echo "These files are the attested \`dist/site\` tree from \`grokwallet-app.tar.gz\`."
            echo "Verify with \`gh attestation verify\` and \`node scripts/verify-site.mjs\`. See docs/VERIFY.md."
          } >> dist/RELEASE_NOTES.md
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/grokwallet-app.tar.gz
            dist/grokwallet-bot.tar.gz
            dist/approval-page.MANIFEST
            dist/SHA256SUMS
          draft: false
